[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-agent-system"
version = "0.1.0"
description = "A-share multi-agent paper trading MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.34"]
tui = ["prompt-toolkit>=3.0.47", "InquirerPy>=0.3.4", "rich>=13.7.1"]
storage = ["pymongo>=4.6", "redis>=5.0"]
market = ["tushare>=1.4", "akshare>=1.15", "baostock", "yfinance", "jqdatasdk", "adata"]
backtest = ["backtrader>=1.9"]
agent = ["langgraph>=0.2"]
scheduler = ["APScheduler>=3.10"]
backend = ["fastapi>=0.116", "uvicorn>=0.35"]
dev = ["pytest>=8.0", "httpx>=0.28"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
desktop = ["pyinstaller>=6.0"]
all = [
  "streamlit>=1.34",
  "prompt-toolkit>=3.0.47",
  "InquirerPy>=0.3.4",
  "rich>=13.7.1",
  "pymongo>=4.6",
  "redis>=5.0",
  "tushare>=1.4",
  "akshare>=1.15",
  "baostock",
  "yfinance",
  "jqdatasdk",
  "adata",
  "backtrader>=1.9",
  "langgraph>=0.2",
  "APScheduler>=3.10",
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "pytest>=8.0",
  "httpx>=0.28",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pyinstaller>=6.0",
]

[project.scripts]
astock-agent = "astock_agent_system.cli:main"
astock-tui = "apps.tui.app:run_tui"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
