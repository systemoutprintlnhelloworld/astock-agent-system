[package]
name = "astock-agent-desktop"
version = "0.1.0"
description = "AStock Agent desktop shell"
authors = ["AStock Agent System"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "astock_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "astock-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
